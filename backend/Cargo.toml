[package]
name = "ramz"
version = "0.1.0"
edition = "2021"
description = "Self-hosted password manager backend"

[[bin]]
name = "ramz"
path = "src/main.rs"

[lib]
name = "ramz"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
ring = "0.17"
argon2 = "0.5"
jsonwebtoken = "9"
totp-lite = "2"
data-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
dashmap = "5"
once_cell = "1"
url = "2"
hex = "0.4"
urlencoding = "2"

[dev-dependencies]
axum-test = "14"
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
